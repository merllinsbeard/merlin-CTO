name: verify

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install verifier dependencies
        run: pip install pyyaml

      - name: Verify distribution
        run: python scripts/verify_distribution.py .

      - name: Verify public tree
        run: python scripts/verify_public_tree.py .

      - name: Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact=100 .

      - name: Write receipt
        run: python scripts/write_release_receipt.py --write "$GITHUB_WORKSPACE/merlin-cto.receipt.json"

      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: merlin-cto-receipt
          path: merlin-cto.receipt.json
